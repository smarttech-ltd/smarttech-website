<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - SmartTech LTD</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a1931;color:white;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
.dance-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden;background:#0a1931;pointer-events:none}
.dance-bg::before{content:'';position:absolute;width:200%;height:200%;background:radial-gradient(circle at 20% 30%, rgba(74,163,255,0.22) 0%, transparent 45%),radial-gradient(circle at 80% 70%, rgba(0,229,255,0.18) 0%, transparent 45%);animation:pulse 7s ease-in-out infinite}
.tech-float{position:absolute;opacity:0.28;animation:float linear infinite;pointer-events:none}
@keyframes float{0%{transform:translateY(105vh) rotate(0deg);opacity:0}10%{opacity:0.35}90%{opacity:0.25}100%{transform:translateY(-15vh) rotate(360deg);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.header{background:rgba(10,25,49,0.92);backdrop-filter:blur(14px);padding:14px 16px;border-bottom:1px solid #1e3a5a;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.header a{color:#4aa3ff;text-decoration:none;font-weight:700;font-size:14px}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:2}
.card{background:rgba(13,35,90,0.9);border:1px solid #2a5ab0;border-radius:20px;padding:28px 24px;max-width:400px;width:100%;text-align:center;backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,0.4)}
.input-wrap{position:relative;margin-top:14px}
.input{width:100%;padding:13px 42px 13px 14px;border-radius:12px;border:1px solid #1e3a5a;background:rgba(0,0,0,0.4);color:white;font-size:14px;outline:none}
.input:focus{border-color:#4aa3ff}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#8ec8ff;font-size:16px;background:none;border:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.btn{width:100%;margin-top:14px;background:#4aa3ff;color:#0a1931;border:none;padding:13px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.btn-green{background:#25D366;color:white}.btn-orange{background:#ff9800;color:white}
.msg{margin-top:12px;font-size:12px;color:#ff8fa8;background:rgba(255,70,70,0.12);border:1px solid rgba(255,70,70,0.2);padding:8px 10px;border-radius:10px;display:none}
.msg.show{display:block}
.msg-success{color:#00e676;background:rgba(0,230,118,0.12);border-color:rgba(0,230,118,0.2)}
.lock-icon{width:56px;height:56px;background:rgba(74,163,255,0.15);border:1px solid #2a5ab0;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px}
.link{color:#8ec8ff;font-size:12px;text-decoration:none;cursor:pointer;background:none;border:none}
.link:hover{color:#4aa3ff;text-decoration:underline}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.78);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-box{background:linear-gradient(180deg,#0d2a5a 0%, #0a1931 100%);border:1px solid #2a5ab0;border-radius:20px;padding:22px;max-width:400px;width:100%;position:relative}
.step{display:none}.step.active{display:block}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="dance-bg" id="danceBg"></div>
<div class="header"><a href="index.html">← Back Home</a><span style="margin-left:10px;font-weight:700">Admin Login</span><span style="margin-left:auto;font-size:11px;color:#8ec8ff">Online ICT Platform</span></div>
<div class="wrap">
  <div class="card">
    <div class="lock-icon">🔒</div>
    <img src="logo.png" alt="SmartTech LTD" style="width:64px;height:64px;border-radius:14px;border:2px solid #2a5ab0;margin:0 auto;display:block">
    <div style="margin-top:12px;font-weight:800;color:#4aa3ff;font-size:18px">SmartTech Admin</div>
    <div style="margin-top:4px;font-size:12px;color:#5a6d94">Secure access only</div>
    <div class="input-wrap">
      <input id="pwd" class="input" type="password" placeholder="Enter Admin Password" autocomplete="current-password">
      <button type="button" class="eye" onclick="togglePwd('pwd',this)" id="eyeBtn">👁️</button>
    </div>
    <div id="msg" class="msg"></div>
    <button class="btn" onclick="login()">🔓 Login to Dashboard</button>
    <div style="margin-top:14px;display:flex;justify-content:space-between">
      <button class="link" onclick="openForgot()">🔑 Forgot Password?</button>
      <a href="index.html" class="link">← Home</a>
    </div>
  </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div class="modal" id="forgotModal">
  <div class="modal-box">
    <div style="text-align:center">
      <div style="font-size:28px">🔑</div>
      <div style="font-weight:800;color:#4aa3ff;font-size:18px;margin-top:8px">Reset Admin Password</div>
      <div style="font-size:11px;color:#5a6d94;margin-top:6px">Choose how to receive your code</div>
    </div>

    <!-- STEP 1 - EMAIL ONLY -->
    <div id="step1" class="step active">
      <button class="btn btn-green" style="margin-top:18px" onclick="sendCode('email')">✉️ Send Code to Email - smarttech.ltd.co.ke@gmail.com</button>
      <button class="btn" style="margin-top:14px;background:rgba(255,255,255,0.08);color:#8ec8ff" onclick="closeForgot()">← Back to Login</button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="step">
      <div style="font-size:13px;color:#8ec8ff;margin-top:16px">Enter 8-digit code from your inbox</div>
      <input id="otpInput" class="input" style="margin-top:10px;text-align:center;letter-spacing:6px;font-size:18px;font-weight:800" placeholder="Enter Code" maxlength="8" inputmode="numeric">
      <div id="otpMsg" class="msg"></div>
      <button class="btn btn-orange" style="margin-top:12px" onclick="verifyCode()">✅ Verify Code</button>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn" style="flex:1;background:rgba(255,255,255,0.08);color:#8ec8ff" onclick="showStep(1)">← Resend</button>
        <button class="btn" style="flex:1;background:rgba(255,255,255,0.08);color:#8ec8ff" onclick="closeForgot()">Cancel</button>
      </div>
      <div style="margin-top:10px;font-size:10px;color:#5a6d94;text-align:center">Code expires in 10 minutes. Resend creates a new code and old code stops working.</div>
    </div>

    <!-- STEP 3 -->
    <div id="step3" class="step">
      <div style="font-size:13px;color:#00e676;margin-top:16px">✅ Code verified! Set new password</div>
      <div class="input-wrap"><input id="newPwd" class="input" type="password" placeholder="New Password" autocomplete="new-password"><button type="button" class="eye" onclick="togglePwd('newPwd',this)">👁️</button></div>
      <div class="input-wrap"><input id="confirmPwd" class="input" type="password" placeholder="Confirm Password" autocomplete="new-password"><button type="button" class="eye" onclick="togglePwd('confirmPwd',this)">👁️</button></div>
      <div id="newPwdMsg" class="msg"></div>
      <button class="btn btn-green" style="margin-top:12px" onclick="setNewPassword()">🔒 Save New Password</button>
    </div>
  </div>
</div>

<script>
const bg=document.getElementById('danceBg');
const icons=['💻','🖥️','🔐','🛡️','⚙️','🚀','🤖','💳','💰','👨‍💻'];
for(let i=0;i<22;i++){const el=document.createElement('div');el.className='tech-float';el.textContent=icons[Math.floor(Math.random()*icons.length)];el.style.left=Math.random()*100+'%';el.style.animationDelay=(Math.random()*10)+'s';el.style.animationDuration=(8+Math.random()*10)+'s';el.style.fontSize=(16+Math.random()*20)+'px';bg.appendChild(el);}

function togglePwd(inputId, btn){
  const input=document.getElementById(inputId);
  if(!input || !btn) return;
  if(input.type==='password'){input.type='text';btn.textContent='🙈';}else{input.type='password';btn.textContent='👁️';}
}
function getAdminPwd(){
  return localStorage.getItem('smarttech_admin_password') || localStorage.getItem('adminPassword') || 'admin123';
}
function login(){
  const pwd=document.getElementById('pwd').value.trim();
  const msg=document.getElementById('msg');
  if(!pwd){msg.textContent='⚠️ Enter password first.';msg.className='msg show';return;}
  if(pwd===getAdminPwd()){
    localStorage.setItem('smarttech_admin','true');
    localStorage.setItem('isAdmin','true');
    msg.classList.remove('show');
    window.location.href='admin-dashboard.html';
  } else {
    msg.textContent='❌ Wrong password. Access denied.';
    msg.className='msg show';
    document.getElementById('pwd').value='';
    document.getElementById('pwd').focus();
  }
}
document.getElementById('pwd').addEventListener('keypress',e=>{if(e.key==='Enter') login();});
document.getElementById('pwd').addEventListener('input',()=>{document.getElementById('msg').classList.remove('show');});

// FORGOT FLOW - EMAIL ONLY, CODE NEVER VISIBLE, GOES DIRECTLY TO INBOX
const ADMIN_EMAIL = 'smarttech.ltd.co.ke@gmail.com';

function openForgot(){
  document.getElementById('forgotModal').classList.add('show');
  showStep(1);
  document.getElementById('otpInput').value='';
  document.getElementById('otpMsg').classList.remove('show');
}
function closeForgot(){document.getElementById('forgotModal').classList.remove('show');}
function showStep(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step'+n).classList.add('active');
}
function generateRandomCode(){
  if(window.crypto && window.crypto.getRandomValues){
    const arr = new Uint32Array(1);
    window.crypto.getRandomValues(arr);
    return (10000000 + (arr[0] % 90000000)).toString();
  }
  return Math.floor(10000000 + Math.random()*90000000).toString();
}

function sendCode(method){
  // Kill old code
  localStorage.removeItem('resetOTP');
  localStorage.removeItem('resetOTPTime');
  const generatedOTP = generateRandomCode();
  localStorage.setItem('resetOTP', generatedOTP);
  localStorage.setItem('resetOTPTime', Date.now().toString());
  localStorage.setItem('resetOTPMethod', method);
  document.getElementById('otpInput').value='';
  document.getElementById('otpMsg').classList.remove('show');

  if(method === 'email'){
    // EMAIL ONLY - Code in POST body only, never in URL / screen. Works on desktop, no download.
    fetch('https://formsubmit.co/ajax/' + ADMIN_EMAIL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
      body: JSON.stringify({
        name: 'SmartTech Admin',
        email: ADMIN_EMAIL,
        subject: 'SmartTech Admin Reset Code - ' + generatedOTP,
        message: 'Your SmartTech Admin Password Reset Code is: ' + generatedOTP + '\n\nValid for 10 minutes.\nIf you did not request this, ignore this email.',
        _subject: 'SmartTech Admin Reset Code - ' + generatedOTP,
        _template: 'table',
        _captcha: 'false'
      })
    }).catch(()=>{});
    // Hidden iframe backup - also hidden, helps on desktop if fetch is blocked
    try{
      const iframe = document.createElement('iframe');
      iframe.name = 'hiddenEmailFrame';
      iframe.style.display = 'none';
      document.body.appendChild(iframe);
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = 'https://formsubmit.co/' + ADMIN_EMAIL;
      form.target = 'hiddenEmailFrame';
      form.style.display = 'none';
      const fields = {
        name: 'SmartTech Admin',
        email: ADMIN_EMAIL,
        subject: 'SmartTech Admin Reset Code - ' + generatedOTP,
        message: 'Your SmartTech Admin Password Reset Code is: ' + generatedOTP + '\n\nValid for 10 minutes.\nIf you did not request this, ignore this email.',
        _subject: 'SmartTech Admin Reset Code - ' + generatedOTP,
        _template: 'table',
        _captcha: 'false',
        _next: 'about:blank'
      };
      for(const k in fields){
        const inp = document.createElement('input');
        inp.type = 'hidden'; inp.name = k; inp.value = fields[k];
        form.appendChild(inp);
      }
      document.body.appendChild(form);
      form.submit();
      setTimeout(()=>{ try{form.remove(); iframe.remove();}catch(e){} }, 3000);
    }catch(e){}
    setTimeout(()=>{showStep(2);document.getElementById('otpInput').focus();}, 600);
  }
}

function verifyCode(){
  const entered=document.getElementById('otpInput').value.trim();
  const msg=document.getElementById('otpMsg');
  const saved=localStorage.getItem('resetOTP');
  const time=parseInt(localStorage.getItem('resetOTPTime')||'0');
  const now=Date.now();
  if(!entered){msg.textContent='⚠️ Enter the code first.';msg.className='msg show';return;}
  if(!saved){msg.textContent='❌ No code. Tap Resend.';msg.className='msg show';return;}
  if(now - time > 10*60*1000){
    localStorage.removeItem('resetOTP');
    localStorage.removeItem('resetOTPTime');
    msg.textContent='❌ Code expired. Tap Resend for a new code.';msg.className='msg show';return;
  }
  if(entered===saved){
    msg.textContent='';msg.classList.remove('show');
    showStep(3);
    document.getElementById('newPwd').focus();
  } else {
    msg.textContent='❌ Wrong code. Check inbox for the latest code.';msg.className='msg show';
  }
}
function setNewPassword(){
  const newPwd=document.getElementById('newPwd').value.trim();
  const confirmPwd=document.getElementById('confirmPwd').value.trim();
  const msg=document.getElementById('newPwdMsg');
  if(newPwd.length<4){msg.textContent='❌ Password must be at least 4 characters';msg.className='msg show';return;}
  if(newPwd!==confirmPwd){msg.textContent='❌ Passwords do not match';msg.className='msg show';return;}
  localStorage.setItem('smarttech_admin_password', newPwd);
  localStorage.setItem('adminPassword', newPwd);
  localStorage.removeItem('resetOTP');
  localStorage.removeItem('resetOTPTime');
  document.getElementById('newPwd').value='';
  document.getElementById('confirmPwd').value='';
  msg.textContent='✅ Password saved! Login with new password now.';msg.className='msg msg-success show';
  setTimeout(()=>{closeForgot();document.getElementById('msg').textContent='✅ Password changed! Login with new password';document.getElementById('msg').className='msg msg-success show';document.getElementById('pwd').focus();}, 1200);
}
document.getElementById('forgotModal').addEventListener('click',e=>{if(e.target.id==='forgotModal') closeForgot();});
</script>
</body>
</html>
